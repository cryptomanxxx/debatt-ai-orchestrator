name: Oraklet ACT-MAP + VEM-Sci research pilot
on:
  workflow_dispatch:
    inputs:
      seed:
        description: One-to-nine digit deterministic synthetic fixture seed
        type: string
        required: true
        default: '20261016'
      cases_per_level:
        description: Synthetic fixtures per difficulty level (2-50)
        type: choice
        options: ['2', '4', '6', '10', '20', '50']
        required: true
        default: '6'
permissions:
  contents: read
concurrency:
  group: act-map-vem-pilot
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify causal correspondence and evidence gate regressions
        run: python3 -m unittest discover -s tests-research -p test_act_map_benchmark.py -v
      - name: Run seeded ACT-MAP benchmark and evidence-gated evaluation
        env:
          EXPERIMENT_SEED: ${{ inputs.seed }}
          CASES_PER_LEVEL: ${{ inputs.cases_per_level }}
        run: |
          python3 research/act_map_benchmark.py \
            --seed "$EXPERIMENT_SEED" \
            --cases-per-level "$CASES_PER_LEVEL" \
            --output reports/act-map/report.json
      - name: Preserve auditable per-run JSON report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: act-map-vem-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/act-map/report.json
          if-no-files-found: warn
          retention-days: 30
