name: Blablador scientific model benchmark

on:
  workflow_dispatch:
    inputs:
      models:
        description: 'Comma-separated chat model aliases (up to 7)'
        required: true
        type: string
        default: 'alias-kimi-k3-1m,alias-glm-5.3-flash,alias-deepseek-v41-flash-booster,alias-mimo-v2.6-pro,alias-qwen3.8-flash-next,alias-fast'

permissions:
  contents: read

concurrency:
  group: blablador-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    environment: research-inference
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test Cloudflare benchmark transport offline
        run: python3 -m unittest discover -s research -p 'test_cloudflare_benchmark_client.py'
      - name: Compare models on bounded research tasks
        env:
          ORCHESTRATOR_API_KEY: ${{ secrets.ORCHESTRATOR_API_KEY }}
          BENCHMARK_MODELS: ${{ inputs.models }}
        run: python3 research/blablador_benchmark.py
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blablador-benchmark-results
          path: blablador-benchmark.json
          if-no-files-found: warn
          retention-days: 30
