name: Blablador scientific reasoning benchmark v2

on:
  workflow_dispatch:
    inputs:
      models:
        description: 'Comma-separated allowlisted Blablador aliases; default tests all six'
        required: true
        type: string
        default: 'alias-kimi-k3-1m,alias-glm-5.3-flash,alias-deepseek-v41-flash-booster,alias-mimo-v2.6-pro,alias-qwen3.8-flash-next,alias-fast'
      repeats:
        description: 'Repetitions per scientific task (1–3)'
        required: true
        type: choice
        options: ['1', '2', '3']
        default: '2'

permissions:
  contents: read

concurrency:
  group: blablador-scientific-v2
  cancel-in-progress: false

jobs:
  scientific-v2:
    environment: research-inference
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test shared Cloudflare transport offline
        run: |
          python3 -m unittest discover -s research -p 'test_cloudflare_benchmark_client.py'
          python3 -m unittest discover -s research -p 'test_blablador_scientific_v2.py'
      - name: Run repeatable scientific questions
        env:
          ORCHESTRATOR_API_KEY: ${{ secrets.ORCHESTRATOR_API_KEY }}
          BENCHMARK_MODELS: ${{ inputs.models }}
          BENCHMARK_REPEATS: ${{ inputs.repeats }}
        run: python3 research/blablador_scientific_v2.py
      - name: Save per-task results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blablador-scientific-v2-results
          path: blablador-scientific-v2.json
          retention-days: 30
          if-no-files-found: warn
