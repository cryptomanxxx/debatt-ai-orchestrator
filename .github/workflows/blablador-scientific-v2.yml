name: Blablador scientific reasoning benchmark v2

on:
  workflow_dispatch:
    inputs:
      models:
        description: 'Comma-separated allowlisted Blablador aliases; default tests all six'
        required: true
        type: string
        default: 'alias-kimi-k3-1m,alias-glm-5.3-flash,alias-deepseek-v41-flash-booster,alias-mimo-v2.6-pro,alias-qwen3.8-flash-next,alias-fast'
      repeats:
        description: 'Repetitions per scientific task (1–3)'
        required: true
        type: choice
        options: ['1', '2', '3']
        default: '2'

permissions:
  contents: read

concurrency:
  group: blablador-scientific-v2
  cancel-in-progress: false

jobs:
  scientific-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Run repeatable scientific questions
        env:
          BLABLADOR_API_KEY: ${{ secrets.BLABLADOR_API_KEY }}
          BENCHMARK_MODELS: ${{ inputs.models }}
          BENCHMARK_REPEATS: ${{ inputs.repeats }}
        run: python3 research/blablador_scientific_v2.py
      - name: Save per-task results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: blablador-scientific-v2-results
          path: blablador-scientific-v2.json
          retention-days: 30
          if-no-files-found: warn
