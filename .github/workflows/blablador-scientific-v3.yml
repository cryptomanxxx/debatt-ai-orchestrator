name: Blablador scientific benchmark v3

on:
  workflow_dispatch:
    inputs:
      models:
        description: 'Comma-separated model aliases (up to six)'
        required: true
        type: string
        default: 'alias-kimi-k3-1m,alias-glm-5.3-flash,alias-deepseek-v41-flash-booster,alias-mimo-v2.6-pro,alias-qwen3.8-flash-next,alias-fast'
      repeats:
        description: 'Runs per task (1–3)'
        required: true
        type: choice
        options: ['1', '2', '3']
        default: '2'

permissions:
  contents: read

concurrency:
  group: blablador-scientific-v3
  cancel-in-progress: false

jobs:
  benchmark:
    environment: research-inference
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install exact validator dependency
        run: python -m pip install sympy==1.13.3
      - name: Test scientific scoring
        run: |
          python -m unittest discover -s research -p 'test_cloudflare_benchmark_client.py'
          python -m unittest discover -s research -p 'test_blablador_scientific_v3.py'
      - name: Benchmark models
        env:
          ORCHESTRATOR_API_KEY: ${{ secrets.ORCHESTRATOR_API_KEY }}
          BENCHMARK_MODELS: ${{ inputs.models }}
          BENCHMARK_REPEATS: ${{ inputs.repeats }}
        run: python research/blablador_scientific_v3.py
      - name: Upload detailed results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: blablador-scientific-v3-results
          path: blablador-scientific-v3.json
          retention-days: 30
          if-no-files-found: warn
