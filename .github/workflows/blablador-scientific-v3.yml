name: Blablador scientific benchmark v3

on:
  workflow_dispatch:
    inputs:
      models:
        description: 'Comma-separated model aliases (up to six)'
        required: true
        type: string
        default: 'alias-kimi-k3-1m,alias-glm-5.3-flash,alias-deepseek-v41-flash-booster,alias-mimo-v2.6-pro,alias-qwen3.8-flash-next,alias-fast'
      repeats:
        description: 'Runs per task (1–3)'
        required: true
        type: choice
        options: ['1', '2', '3']
        default: '2'

permissions:
  contents: read

concurrency:
  group: blablador-scientific-v3
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install exact validator dependency
        run: python -m pip install sympy==1.13.3
      - name: Test scientific scoring
        run: python -m unittest discover -s research -p 'test_blablador_scientific_v3.py'
      - name: Benchmark models
        env:
          BLABLADOR_API_KEY: ${{ secrets.BLABLADOR_API_KEY }}
          BENCHMARK_MODELS: ${{ inputs.models }}
          BENCHMARK_REPEATS: ${{ inputs.repeats }}
        run: python research/blablador_scientific_v3.py
      - name: Upload detailed results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blablador-scientific-v3-results
          path: blablador-scientific-v3.json
          retention-days: 30
          if-no-files-found: warn
