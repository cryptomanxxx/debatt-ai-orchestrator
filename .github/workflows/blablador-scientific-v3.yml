name: Scientific benchmark v3 (HIP or Blablador)

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'Provider / model (menu refreshed from the Cloudflare catalog by "Refresh HIP/Blablador model menu")'
        required: true
        type: choice
        # BEGIN GENERATED RESEARCH MODEL OPTIONS providers=hip,blablador all=12
        options:
          - "hip / GLM-5.2-AWQ-INT4 (rekommenderad 20/20)"
          - "blablador / deepseek-v4.1-flash-at-hzdr (rekommenderad 15/15)"
          - "hip / alla"
          - "hip / gemma-4-31B-it"
          - "hip / GLM-5.2-AWQ-INT4"
          - "hip / leo-hessianai-13b-chat"
          - "hip / Ministral-3-14B-Instruct-2512"
          - "hip / Mistral-Medium-3.5-128B"
          - "hip / occiglot-7b-eu5-instruct"
          - "hip / qwen3-vl-30b-a3b-instruct-awq"
          - "hip / Qwen3.8-27B"
          - "blablador / deepseek-v4.1-flash-at-hzdr"
          - "blablador / Swift-Qwen3.8-27b"
          - "blablador / trustllm-v2-8b-sft"
          - "blablador / trustllm-v2-8b-sft-8k"
          - "blablador / trustllm-v2-8b-sft-mixb2-exp"
          - "blablador / alias-aleph-kolibri-1 = Kolibri-1"
          - "blablador / alias-apertus-70b = Apertus-v1.5-70B"
          - "blablador / alias-deepseek-v41-flash-booster = DeepSeek-V4.1-Flash-1017"
          - "blablador / alias-eve = EVE-Instruct"
          - "blablador / alias-fast = gpt-oss-120b"
          - "blablador / alias-glm-5.3-flash = GLM-5.3-Flash-AWQ-W4A16"
          - "blablador / alias-hyper-arete = HyperArete-27B-W4A16"
          - "blablador / alias-hyperqwen-27b = Qwen3.8-27B-W4A16-AutoRound"
          - "blablador / alias-kimi-k31-pro = Kimi-K3.1-Pro"
          - "blablador / alias-medgemma = medgemma-27b-it"
          - "blablador / alias-mimo-v2.6-flash = MiMo-V2.6-Flash-RL"
          - "blablador / alias-mimo-v2.6-pro = MiMo-V2.6-Pro-RL"
          - "blablador / alias-mistral-large = alias-mistral-large"
          - "blablador / alias-muse-spark = Muse-Spark-Open-816B-A42B"
          - "blablador / alias-ocr = LightOnOCR-3-4B"
          - "blablador / alias-qwen3.8-27b = Qwen3.8-27B"
          - "blablador / alias-qwen3.8-flash-next = Qwen3.8-Flash-Next-AWQ-W4A16"
          - "blablador / alias-qwen38-27b = Qwen3.8-27B-FP8"
          - "blablador / alias-qwen38-quick = Swift-1.5-Qwen3.8-27b"
          - "blablador / alias-science = Hydrogen-1.0-NVFP4"
          - "blablador / alias-voice-drama3 = drama-3"
        default: "hip / GLM-5.2-AWQ-INT4 (rekommenderad 20/20)"
        # END GENERATED RESEARCH MODEL OPTIONS
      repeats:
        description: 'Runs per task (1–3)'
        required: true
        type: choice
        options: ['1', '2', '3']
        default: '2'

permissions:
  contents: read

concurrency:
  group: blablador-scientific-v3
  cancel-in-progress: false

jobs:
  benchmark:
    environment: research-inference
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install exact validator dependency
        run: python -m pip install sympy==1.13.3
      - name: Test scientific scoring
        run: |
          python -m unittest discover -s research -p 'test_cloudflare_benchmark_client.py'
          python -m unittest discover -s research -p 'test_blablador_scientific_v3.py'
      - name: Benchmark models
        env:
          ORCHESTRATOR_API_KEY: ${{ secrets.ORCHESTRATOR_API_KEY }}
          BENCHMARK_MODEL: ${{ inputs.model }}
          BENCHMARK_REPEATS: ${{ inputs.repeats }}
        run: python research/blablador_scientific_v3.py
      - name: Upload detailed results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: blablador-scientific-v3-results
          path: blablador-scientific-v3.json
          retention-days: 30
          if-no-files-found: warn
