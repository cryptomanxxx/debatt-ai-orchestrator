name: Blablador API connection test

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'Chat model alias to test (must be present in /v1/models)'
        required: true
        type: string
        default: 'alias-fast'

permissions:
  contents: read

jobs:
  blablador-smoke:
    environment: research-inference
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: List accessible Blablador models and test inference
        env:
          BLABLADOR_API_KEY: ${{ secrets.BLABLADOR_API_KEY }}
          BLABLADOR_TEST_MODEL: ${{ inputs.model }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          base = "https://api.blablador.fz-juelich.de/v1"
          key = os.environ.get("BLABLADOR_API_KEY", "")
          model = os.environ.get("BLABLADOR_TEST_MODEL", "alias-fast")
          if not key:
              sys.exit("BLABLADOR_API_KEY is missing from repository Actions secrets.")
          if not model or len(model) > 160 or not all(c.isalnum() or c in "._-/" for c in model):
              sys.exit("Invalid model alias.")

          def request(path, payload=None):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              headers = {"Authorization": "Bearer " + key, "Accept": "application/json"}
              if data is not None:
                  headers["Content-Type"] = "application/json"
              req = urllib.request.Request(base + path, data=data, headers=headers, method="POST" if data else "GET")
              try:
                  with urllib.request.urlopen(req, timeout=45) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  # Do not log upstream response bodies: they may echo confidential request data.
                  sys.exit(f"Blablador request {path} failed with HTTP {error.code}.")
              except (urllib.error.URLError, TimeoutError) as error:
                  sys.exit(f"Blablador request {path} failed: {type(error).__name__}.")
              except (ValueError, UnicodeError):
                  sys.exit(f"Blablador request {path} returned invalid JSON.")

          response = request("/models")
          models = response.get("data", [])
          if not isinstance(models, list) or not models:
              sys.exit("No accessible models returned.")
          ids = sorted({m["id"] for m in models if isinstance(m, dict) and isinstance(m.get("id"), str)})
          print(f"Accessible models: {len(ids)}")
          print("| Model alias | Backing model | Max context |")
          print("| --- | --- | --- |")
          for entry in sorted(models, key=lambda x: str(x.get("id", ""))):
              if not isinstance(entry, dict) or not isinstance(entry.get("id"), str):
                  continue
              # JSON quoting avoids line breaks and workflow-command injection from remote strings.
              fields = [str(entry.get("id", "")), str(entry.get("root", "unknown")), str(entry.get("max_model_len", "unknown"))]
              fields = [json.dumps(v, ensure_ascii=True) for v in fields]
              print("| " + " | ".join(fields) + " | ")

          if model not in ids:
              sys.exit(f"Requested chat model is not in /models: {model}")
          answer = request("/chat/completions", {
              "model": model,
              "messages": [{"role": "user", "content": "Reply with exactly one word: OK"}],
              "max_tokens": 64,
              "temperature": 0,
          })
          choices = answer.get("choices", [])
          text = choices[0].get("message", {}).get("content") if choices else None
          if not isinstance(text, str) or not text.strip():
              sys.exit("Chat completions returned no nonempty text response.")
          print(f"Chat inference succeeded for model {model}; response received ({len(text)} characters).")
          PY
