name: Mät BootLoops steg i Cloudflare
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bootloops-diagnostics
  cancel-in-progress: false
jobs:
  bootloops-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Kör tre omgångar med fem fasta mätsteg
        env:
          ORCHESTRATOR_API_KEY: ${{ secrets.ORCHESTRATOR_API_KEY }}
        run: python3 tests-live/bootloops_diagnostics.py
