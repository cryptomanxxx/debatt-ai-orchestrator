name: Testa BootLoops i Cloudflare
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bootloops-live
  cancel-in-progress: false
jobs:
  bootloops-live:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Kontrollera riktig BootLoops och avvisade testvärden
        env:
          ORCHESTRATOR_API_KEY: ${{ secrets.ORCHESTRATOR_API_KEY }}
        run: python3 tests-live/bootloops_smoke.py
