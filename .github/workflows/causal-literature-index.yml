name: Causal literature index pilot
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Test provenance and unverified evidence boundaries
        run: python3 -m unittest discover -s tests-research -p test_causal_literature_index.py -v
      - name: Produce labeled sample retrieval index
        run: python3 research/causal_literature_index.py --input research/data/causal-literature-sample.jsonl --output reports/causal-literature/report.json
      - name: Retain audit artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: causal-literature-index-${{ github.run_id }}
          path: reports/causal-literature/report.json
          retention-days: 30
