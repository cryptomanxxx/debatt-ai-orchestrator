name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python3 -m pip install -r research/requirements.lock
      - run: npm test
      - run: npm run test:science
      - run: npm run check:workers
      - run: npm run test:workers
  bootloops:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r research/requirements.lock
      - run: npm run test:bootloops

  bootloops-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.19'
      - run: npm ci
      - run: npm run check:workers
      - run: npm run check:workers:bootloops
      - run: npm run check:bootloops:worker
      - run: npm run test:bootloops:worker
