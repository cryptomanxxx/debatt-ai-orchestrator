name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python3 -m pip install -r research/requirements.lock
      - run: python3 -m pip install -r research/sympy-requirements.lock
      - run: python3 -m pip install -r research/sklearn-requirements.lock
      - run: python3 -m pip check
      - run: python3 scripts/check_sympy.py
      - run: python3 scripts/check_sklearn.py
      - run: npm run test:sympy
      - run: npm run test:sklearn
      - run: npm test
      - run: python3 -m pip install -r research/plot-requirements.lock
      - run: npm run test:plots
      - run: npm run test:science
      - run: npm run check:workers
      - run: npm run test:workers
  pymc:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r research/pymc-requirements.lock
      - run: python3 -m pip install -r research/sympy-requirements.lock
      - run: python3 -m pip install -r research/sklearn-requirements.lock
      - run: python3 -m pip check
      - run: python3 scripts/check_sympy.py
      - run: python3 scripts/check_sklearn.py
      - run: npm run test:pymc
  bootloops:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r research/requirements.lock
      - run: npm run test:bootloops

  bootloops-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.19'
      - run: npm ci
      - run: npm run check:workers
      - run: npm run check:workers:bootloops
      - run: npm run check:bootloops:worker
      - run: npm run test:bootloops:worker

  dowhy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installera och kontrollera isolerad DoWhy-miljö
        run: |
          python3 -m venv .dowhy-venv
          .dowhy-venv/bin/python -m pip install -r research/dowhy-requirements.lock
          .dowhy-venv/bin/python -m pip check
          .dowhy-venv/bin/python scripts/check_dowhy.py
      - run: npm run test:dowhy

  shallow-water:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r research/shallow-water-requirements.lock -r research/plot-requirements.lock
      - run: python3 -m pip check
      - run: npm run test:shallow-water
