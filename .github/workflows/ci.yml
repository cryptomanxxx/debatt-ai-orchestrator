name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  literature-database:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: node --test tests-research/literature-database.test.mjs
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Test all migrations, reconciliation and rollback in PostgreSQL
        run: |
          psql -v ON_ERROR_STOP=1 -c 'create role anon; create role authenticated; create role service_role bypassrls;'
          node scripts/test-migrations.mjs
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Test ACT-MAP / VEM-Sci CPU-only pilot
        run: python3 -m unittest discover -s tests-research -p test_act_map_benchmark.py -v
      - name: Validate causal literature ingestion and provenance
        run: python3 -m unittest discover -s tests-research -p test_causal_literature_index.py -v
      - run: npm ci
      - run: npm run format:check
      - run: python3 -m pip install -r research/requirements.lock
      - run: python3 -m pip install -r research/sympy-requirements.lock
      - run: python3 -m pip install -r research/sklearn-requirements.lock
      - run: python3 -m pip check
      - run: python3 scripts/check_sympy.py
      - run: python3 scripts/check_sklearn.py
      - run: npm run test:sympy
      - run: npm run test:sklearn
      - run: npm test
      - run: python3 -m pip install -r research/plot-requirements.lock
      - run: npm run test:plots
      - run: npm run test:science
      - run: npm run check:workers
      - run: npm run test:workers
  pymc:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r research/pymc-requirements.lock
      - run: python3 -m pip install -r research/sympy-requirements.lock
      - run: python3 -m pip install -r research/sklearn-requirements.lock
      - run: python3 -m pip check
      - run: python3 scripts/check_sympy.py
      - run: python3 scripts/check_sklearn.py
      - run: npm run test:pymc
  bootloops:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r research/requirements.lock
      - run: npm run test:bootloops

  bootloops-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.19'
      - run: npm ci
      - run: npm run check:workers
      - run: npm run check:workers:bootloops
      - run: npm run check:bootloops:worker
      - run: npm run test:bootloops:worker

  dowhy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Installera och kontrollera isolerad DoWhy-miljö
        run: |
          python3 -m venv .dowhy-venv
          .dowhy-venv/bin/python -m pip install -r research/dowhy-requirements.lock
          .dowhy-venv/bin/python -m pip check
          .dowhy-venv/bin/python scripts/check_dowhy.py
      - run: npm run test:dowhy

  shallow-water:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r research/shallow-water-requirements.lock -r research/plot-requirements.lock
      - run: python3 -m pip check
      - run: npm run test:shallow-water
