name: Citation graph novelty check (manual)
on:
  workflow_dispatch:
    inputs:
      planner_report_id:
        description: 'Saved evidence planner report UUID'
        type: string
        required: true
      candidate_id:
        description: 'Exact candidate ID from that report (for example arp-fluid-state-estimation)'
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: citation-novelty
  cancel-in-progress: false
jobs:
  novelty:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Test novelty-check contracts
        run: node --test tests-research/citation-novelty.test.mjs
      - name: Search later citing work in the OpenAlex citation graph
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          PLANNER_REPORT_ID: ${{ inputs.planner_report_id }}
          RESEARCH_CANDIDATE_ID: ${{ inputs.candidate_id }}
        run: node research/citation-novelty.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: citation-novelty-${{ github.run_id }}
          path: reports/citation-novelty/
          retention-days: 30
          if-no-files-found: warn
