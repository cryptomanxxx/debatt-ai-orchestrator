name: Discover HIP and Blablador research models
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: research-provider-model-discovery
  cancel-in-progress: false
jobs:
  discover:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Run bounded read-only model discovery
        id: discovery
        env:
          ORCHESTRATOR_API_KEY: ${{ secrets.ORCHESTRATOR_API_KEY }}
        run: node research/discover-worker-models.mjs
      - name: Test generated dropdown validation
        run: node --test tests-research/update-scientific-model-menu.test.mjs
      - name: Archive catalog for research model selection
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: oraklet-research-model-catalog-${{ github.run_id }}
          path: reports/provider-catalog/
          if-no-files-found: ignore
          retention-days: 14
      - name: Publish dynamic model choices to Scientific v3 on main
        if: success() || (failure() && steps.discovery.outcome == 'failure')
        env:
          MODEL_MENU_WORKFLOW_TOKEN: ${{ secrets.MODEL_MENU_WORKFLOW_TOKEN }}
        run: node research/update-scientific-model-menu.mjs
