name: Discover HIP and Blablador research models
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: research-provider-model-discovery
  cancel-in-progress: false
jobs:
  discover:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Test explicit model filtering
        run: node --test tests-research/explicit-models.test.mjs
      - name: Run bounded read-only model discovery
        env:
          ORCHESTRATOR_API_KEY: ${{ secrets.ORCHESTRATOR_API_KEY }}
        run: node research/discover-worker-models.mjs
      - name: Archive catalog for research model selection
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oraklet-research-model-catalog-${{ github.run_id }}
          path: reports/provider-catalog/
          if-no-files-found: ignore
          retention-days: 14
