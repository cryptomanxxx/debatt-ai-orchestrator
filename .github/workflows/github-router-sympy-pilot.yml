name: GitHub Router + Oraklet SymPy research pilot
on:
  workflow_dispatch:
    inputs:
      provider:
        description: Choose an available model from Blablador/HIP
        type: choice
        required: true
        options: [auto, blablador, hip]
        default: auto
      seed:
        description: Deterministic one-to-nine-digit synthetic fixture seed
        type: string
        required: true
        default: '20261016'
permissions:
  contents: read
concurrency:
  group: github-router-sympy-pilot
  cancel-in-progress: false
jobs:
  research:
    environment: research-inference
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install pinned SymPy verifier
        run: python3 -m pip install -r research/sympy-requirements.lock
      - name: Test bounded routing adapter
        run: node --test tests-research/github-router-sympy-pilot.test.mjs
      - name: Select GitHub model and run three verified cases
        env:
          ORCHESTRATOR_API_KEY: ${{ secrets.ORCHESTRATOR_API_KEY }}
          ROUTER_PROVIDER: ${{ inputs.provider }}
          EXPERIMENT_SEED: ${{ inputs.seed }}
        run: node research/github-router-sympy-pilot.mjs
      - name: Preserve complete or partial experiment results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: github-router-sympy-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/github-router-sympy/
          retention-days: 30
          if-no-files-found: warn
