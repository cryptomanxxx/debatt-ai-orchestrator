name: HIP scientific benchmark

on:
  workflow_dispatch:
    inputs:
      models:
        description: 'Comma-separated exact chat model IDs (all nine by default)'
        required: true
        type: string
        default: 'GLM-5.2-AWQ-INT4,Kimi-K2.6,Ministral-3-14B-Instruct-2512,Mistral-Medium-3.5-128B,Qwen3.8-27B,gemma-4-31B-it,leo-hessianai-13b-chat,occiglot-7b-eu5-instruct,qwen3-vl-30b-a3b-instruct-awq'
      repeats:
        description: 'Repeats per task (all models: 45, 90 or 135 inference calls)'
        required: true
        type: choice
        options: ['1', '2', '3']
        default: '2'

permissions:
  contents: read

concurrency:
  group: hip-scientific
  cancel-in-progress: false

jobs:
  benchmark:
    environment: research-inference
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install exact validator dependency
        run: python -m pip install sympy==1.13.3
      - name: Test scoring and HIP runner offline
        run: |
          python -m unittest discover -s research -p 'test_cloudflare_benchmark_client.py'
          python -m unittest discover -s research -p 'test_*scientific*.py'
      - name: Compare HIP chat models via Cloudflare Worker (internal research)
        env:
          ORCHESTRATOR_API_KEY: ${{ secrets.ORCHESTRATOR_API_KEY }}
          BENCHMARK_MODELS: ${{ inputs.models }}
          BENCHMARK_REPEATS: ${{ inputs.repeats }}
        run: python research/hip_scientific.py
      - name: Upload partial or complete results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hip-scientific-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/hip-scientific/
          retention-days: 30
          if-no-files-found: warn
