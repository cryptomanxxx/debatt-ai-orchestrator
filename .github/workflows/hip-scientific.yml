name: HIP scientific benchmark

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'HIP model ("hip / alla" = the nine standard models; menu refreshed by "Refresh HIP/Blablador model menu")'
        required: true
        type: choice
        # BEGIN GENERATED RESEARCH MODEL OPTIONS providers=hip all
        options:
          - "hip / GLM-5.2-AWQ-INT4 (rekommenderad 15/15)"
          - "hip / alla"
          - "hip / gemma-4-31B-it"
          - "hip / GLM-5.2-AWQ-INT4"
          - "hip / Kimi-K2.6"
          - "hip / leo-hessianai-13b-chat"
          - "hip / Ministral-3-14B-Instruct-2512"
          - "hip / Mistral-Medium-3.5-128B"
          - "hip / occiglot-7b-eu5-instruct"
          - "hip / qwen3-vl-30b-a3b-instruct-awq"
          - "hip / Qwen3.8-27B"
        default: "hip / GLM-5.2-AWQ-INT4 (rekommenderad 15/15)"
        # END GENERATED RESEARCH MODEL OPTIONS
      repeats:
        description: 'Repeats per task (all models: 45, 90 or 135 inference calls)'
        required: true
        type: choice
        options: ['1', '2', '3']
        default: '2'

permissions:
  contents: read

concurrency:
  group: hip-scientific
  cancel-in-progress: false

jobs:
  benchmark:
    environment: research-inference
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install exact validator dependency
        run: python -m pip install sympy==1.13.3
      - name: Test scoring and HIP runner offline
        run: |
          python -m unittest discover -s research -p 'test_cloudflare_benchmark_client.py'
          python -m unittest discover -s research -p 'test_*scientific*.py'
      - name: Compare HIP chat models via Cloudflare Worker (internal research)
        env:
          ORCHESTRATOR_API_KEY: ${{ secrets.ORCHESTRATOR_API_KEY }}
          BENCHMARK_MODEL: ${{ inputs.model }}
          BENCHMARK_REPEATS: ${{ inputs.repeats }}
        run: python research/hip_scientific.py
      - name: Upload partial or complete results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hip-scientific-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/hip-scientific/
          retention-days: 30
          if-no-files-found: warn
