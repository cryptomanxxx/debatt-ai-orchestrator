name: HIP API connection test

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'List models only, or make one short synthetic chat call'
        type: choice
        options:
          - list-models
          - smoke-test
        default: list-models
      model:
        description: 'Exact chat model ID from the model list (only for smoke-test)'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: hip-connection-test
  cancel-in-progress: false

jobs:
  hip-test:
    environment: research-inference
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: List HIP models and optionally test inference
        env:
          HIP_API_KEY: ${{ secrets.HIP_API_KEY }}
          HIP_TEST_MODE: ${{ inputs.mode }}
          HIP_TEST_MODEL: ${{ inputs.model }}
        run: node research/hip-smoke.mjs
      - name: Save connection report even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hip-connection-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/hip-test/
          retention-days: 14
          if-no-files-found: ignore
