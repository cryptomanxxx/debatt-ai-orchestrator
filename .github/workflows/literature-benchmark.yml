name: Literature benchmark (manual)

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Papers per query and source (5 predefined queries)'
        type: choice
        required: true
        default: '10'
        options:
          - '5'
          - '10'
          - '20'
      persist:
        description: 'Persist metadata and search history to orchestrator Supabase (migration required)'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: literature-benchmark-live
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Run offline regression tests
        run: node --test tests-research/literature-benchmark.test.mjs tests-research/arxiv-literature.test.mjs tests-research/summarize-literature-benchmark.test.mjs tests-research/literature-database.test.mjs
      - name: Run live benchmark
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          CORE_API_KEY: ${{ secrets.CORE_API_KEY }}
          BENCHMARK_LIMIT: ${{ inputs.limit }}
        run: |
          mkdir -p benchmark-output
          node research/literature-benchmark.mjs "$BENCHMARK_LIMIT" benchmark-output/literature-benchmark.json
      - name: Summarize result status
        if: always()
        run: |
          if [ -f benchmark-output/literature-benchmark.json ]; then
            node research/summarize-literature-benchmark.mjs benchmark-output/literature-benchmark.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Benchmark did not produce a report.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Persist literature metadata and search history
        if: success() && inputs.persist
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node research/literature-database.mjs benchmark-output/literature-benchmark.json
      - name: Upload benchmark artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: literature-benchmark-results
          path: benchmark-output/literature-benchmark.json
          if-no-files-found: warn
          retention-days: 14
