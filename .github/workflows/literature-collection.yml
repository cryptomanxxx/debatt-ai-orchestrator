name: Daily literature collection
on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:
    inputs:
      max_abstracts:
        description: 'Maximum unique articles considered for abstract storage (no model calls)'
        type: choice
        default: '50'
        options: ['5','10','25','50']
permissions:
  contents: read
concurrency:
  group: literature-benchmark-live
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run offline collection tests
        run: node --test tests-research/literature-collection.test.mjs tests-research/literature-abstract-archive.test.mjs tests-research/literature-database.test.mjs
      - name: Collect metadata and persist complete abstracts
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          CORE_API_KEY: ${{ secrets.CORE_API_KEY }}
          LITERATURE_MAX_ABSTRACTS: ${{ inputs.max_abstracts || '50' }}
        run: node research/collect-literature.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: literature-collection-report
          path: reports/literature-collection/
          retention-days: 30
          if-no-files-found: warn
