name: Literature evidence planner (manual)
on:
  workflow_dispatch:
    inputs:
      literature_run_id:
        description: 'Stored literature run UUID (blank uses newest imported run)'
        type: string
        default: ''
      query_index:
        description: 'Zero-based query index within the run (default first query)'
        type: choice
        default: '0'
        options: ['0','1','2','3','4']
      max_papers:
        description: 'Maximum selected articles and model calls'
        type: choice
        default: '5'
        options: ['5','10']
      follow_up_report_id:
        description: 'Optional saved follow-up report UUID: prioritize title anchors and exclude confirmed origin articles'
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: literature-evidence-planner
  cancel-in-progress: false
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Run offline evidence and planner tests
        run: node --test tests-research/literature-evidence.test.mjs tests-research/follow-up-quality.test.mjs tests-research/literature-abstract-archive.test.mjs tests-research/autonomous-planner.test.mjs tests-research/literature-analysis-registry.test.mjs
      - name: Summarize saved literature and propose review candidates
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ORCHESTRATOR_API_KEY: ${{ secrets.ORCHESTRATOR_API_KEY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          LITERATURE_RUN_ID: ${{ inputs.literature_run_id }}
          LITERATURE_QUERY_INDEX: ${{ inputs.query_index }}
          LITERATURE_MAX_PAPERS: ${{ inputs.max_papers }}
          FOLLOW_UP_REPORT_ID: ${{ inputs.follow_up_report_id }}
        run: node research/run-literature-evidence.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: literature-evidence-report
          path: reports/literature-evidence/
          retention-days: 30
          if-no-files-found: warn
