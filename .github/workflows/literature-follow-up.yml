name: Literature follow-up (manual)
on:
  workflow_dispatch:
    inputs:
      planner_report_id:
        description: 'Saved evidence planner report UUID'
        type: string
        required: true
      candidate_id:
        description: 'Exact candidate ID from that report (for example arp-fluid-state-estimation)'
        type: string
        required: true
      limitation_article_id:
        description: 'Optional exact article ID for a limitation (blank selects automatically)'
        type: string
        default: ''
      limitation_finding_index:
        description: 'Optional zero-based finding index 0–2; provide together with article ID'
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: literature-benchmark-live
  cancel-in-progress: false
jobs:
  follow-up:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Test follow-up contracts
        run: node --test tests-research/literature-follow-up.test.mjs tests-research/follow-up-quality.test.mjs tests-research/literature-benchmark.test.mjs tests-research/literature-database.test.mjs
      - name: Search and persist candidate review leads
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          CORE_API_KEY: ${{ secrets.CORE_API_KEY }}
          PLANNER_REPORT_ID: ${{ inputs.planner_report_id }}
          RESEARCH_CANDIDATE_ID: ${{ inputs.candidate_id }}
          LIMITATION_ARTICLE_ID: ${{ inputs.limitation_article_id }}
          LIMITATION_FINDING_INDEX: ${{ inputs.limitation_finding_index }}
        run: node research/literature-follow-up.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: literature-follow-up-report
          path: reports/literature-follow-up/
          retention-days: 30
          if-no-files-found: warn
