name: Oraklets kalibrering
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  summary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Sammanställ angiven säkerhet mot verifierat utfall per modell
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node research/calibration-summary.mjs
      - name: Spara sammanställningen
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oraklet-calibration-${{ github.run_id }}
          path: reports/calibration/
          if-no-files-found: ignore
          retention-days: 30
