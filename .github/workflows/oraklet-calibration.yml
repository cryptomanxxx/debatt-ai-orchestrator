name: Oraklets kalibrering
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  summary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Sammanställ angiven säkerhet mot verifierat utfall per modell
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node research/calibration-summary.mjs
      - name: Spara sammanställningen
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: oraklet-calibration-${{ github.run_id }}
          path: reports/calibration/
          if-no-files-found: ignore
          retention-days: 30
