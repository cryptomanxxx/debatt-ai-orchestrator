name: Oraklet formulerar och testar en hypotes
on:
  push:
    branches: [codex/oraklet-hypothesis-pilot]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: oraklet-research
  cancel-in-progress: false
jobs:
  hypothesis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Installera låsta forskningsberoenden
        run: python3 -m pip install -r research/requirements.lock
      - name: Installera och kontrollera isolerad DoWhy-miljö
        run: |
          python3 -m venv .dowhy-venv
          .dowhy-venv/bin/python -m pip install -r research/dowhy-requirements.lock
          .dowhy-venv/bin/python -m pip check
          .dowhy-venv/bin/python scripts/check_dowhy.py
      - name: Installera och kontrollera Scikit-learn
        run: |
          python3 -m pip install -r research/sklearn-requirements.lock
          python3 -m pip check
          python3 scripts/check_sklearn.py
      - name: Installera och kontrollera SymPy
        run: |
          python3 -m pip install -r research/sympy-requirements.lock
          python3 -m pip check
          python3 scripts/check_sympy.py
      - name: Verifiera hypoteskedjan innan liveförsöket
        run: node --test tests-research/hypothesis-pilot.test.mjs tests-research-python/hypothesis-pilot.test.mjs
      - name: Lås hypotes, analysera och spara resultat
        env:
          ORCHESTRATOR_API_KEY: ${{ secrets.ORCHESTRATOR_API_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node research/run-hypothesis-pilot.mjs
      - name: Spara hypotes och rapport även vid driftfel
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: oraklet-hypotes-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/oraklet-hypothesis/
          if-no-files-found: ignore
