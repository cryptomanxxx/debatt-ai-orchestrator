name: Oraklets forskningslabb
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      experiment:
        description: Experiment (catalog-only visar alla metoder; auto väljer körbart)
        type: choice
        options:
          - auto
          - catalog-only
          - ratfit-baseline
          - ratfit-feedback
          - rankscreen-consistency
          - rankscreen-rank-deficit
          - annihilator-recurrence
          - mixalot-model-comparison
          - statsmodels-ar1
          - sympy-quadratic
          - pymc-gdp-ar1
        default: auto
      seed:
        description: 'Seed: 1–9 siffror; tomt använder dagens UTC-datum'
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: oraklet-research
  cancel-in-progress: false
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Visa experiment och integrationsstatus
        run: node research/show-catalog.mjs
      - name: Installera låsta forskningsberoenden
        if: inputs.experiment != 'catalog-only'
        run: python3 -m pip install -r research/requirements.lock
      - name: Installera låst PyMC-miljö för manuell BNP-uppföljning
        if: inputs.experiment == 'pymc-gdp-ar1'
        run: python3 -m pip install -r research/pymc-requirements.lock
      - name: Installera och kontrollera Scikit-learn
        if: inputs.experiment != 'catalog-only'
        run: |
          python3 -m pip install -r research/sklearn-requirements.lock
          python3 -m pip check
          python3 scripts/check_sklearn.py
      - name: Installera och kontrollera SymPy
        if: inputs.experiment != 'catalog-only'
        run: |
          python3 -m pip install -r research/sympy-requirements.lock
          python3 -m pip check
          python3 scripts/check_sympy.py
      - name: Planera, kör och spara forskning
        if: inputs.experiment != 'catalog-only'
        env:
          EXPERIMENT: ${{ inputs.experiment || 'auto' }}
          EXPERIMENT_SEED: ${{ inputs.seed }}
          ORCHESTRATOR_API_KEY: ${{ secrets.ORCHESTRATOR_API_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node research/runner.mjs
      - name: Spara planer och rapporter även vid driftfel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oraklet-metodtest-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/oraklet-lab/
          if-no-files-found: ignore
