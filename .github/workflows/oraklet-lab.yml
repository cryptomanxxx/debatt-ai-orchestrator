name: Oraklets forskningslabb
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      experiment:
        description: Experiment (catalog-only visar alla metoder; auto väljer körbart)
        type: choice
        options:
          - auto
          - catalog-only
          - shallow-water-hybrid
          - ratfit-baseline
          - ratfit-feedback
          - ratfit-staged-feedback
          - rankscreen-consistency
          - rankscreen-rank-deficit
          - annihilator-recurrence
          - mixalot-model-comparison
          - ar1-power-design
          - statsmodels-ar1
          - sympy-quadratic
          - sklearn-polynomial
          - dowhy-backdoor
          - perturbseq-holdout
          - glucose-absorption
          - glucose-robustness
          - glucose-temperature-evidence
          - insulin-external-curve
          - insulin-curve-shape
          - insulin-warming-forecast
          - pymc-gdp-ar1
        default: auto
      seed:
        description: 'Seed: 1–9 siffror; tomt använder dagens UTC-datum'
        type: string
        default: ''
      problem_bank_id:
        description: 'Valfritt Problem Bank-ID; måste peka på ett katalogexperiment med exakt samma fråga'
        type: string
        default: ''
      problem_bank_version:
        description: 'Problem Bank-version'
        type: string
        default: '1'
permissions:
  contents: read
concurrency:
  group: oraklet-research
  cancel-in-progress: false
jobs:
  experiment:
    runs-on: ubuntu-latest
    # Seven ranked-model calls may each take up to 80 s through the research gateway (about 9 min),
    # plus the bare arm's own step limit and dependency installation.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Visa experiment och integrationsstatus
        run: node research/show-catalog.mjs
      - name: Lös faktiskt experiment för Problem Bank
        id: resolved
        if: inputs.problem_bank_id != ''
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          PROBLEM_BANK_ID: ${{ inputs.problem_bank_id }}
          PROBLEM_BANK_VERSION: ${{ inputs.problem_bank_version || '1' }}
        run: echo "experiment=$(node research/resolve-problem-bank-experiment.mjs)" >> "$GITHUB_OUTPUT"
      - name: Installera låsta forskningsberoenden
        if: inputs.experiment != 'catalog-only' || inputs.problem_bank_id != ''
        run: python3 -m pip install -r research/requirements.lock
      - name: Installera låst PyMC-miljö för BNP-uppföljning
        if: inputs.experiment == 'pymc-gdp-ar1' || steps.resolved.outputs.experiment == 'pymc-gdp-ar1'
        run: python3 -m pip install -r research/pymc-requirements.lock
      - name: Installera och kontrollera isolerad DoWhy-miljö
        if: inputs.experiment != 'catalog-only' || inputs.problem_bank_id != ''
        run: |
          python3 -m venv .dowhy-venv
          .dowhy-venv/bin/python -m pip install -r research/dowhy-requirements.lock
          .dowhy-venv/bin/python -m pip check
          .dowhy-venv/bin/python scripts/check_dowhy.py
      - name: Installera och kontrollera Scikit-learn
        if: inputs.experiment != 'catalog-only' || inputs.problem_bank_id != ''
        run: |
          python3 -m pip install -r research/sklearn-requirements.lock
          python3 -m pip check
          python3 scripts/check_sklearn.py
      - name: Installera och kontrollera SymPy
        if: inputs.experiment != 'catalog-only' || inputs.problem_bank_id != ''
        run: |
          python3 -m pip install -r research/sympy-requirements.lock
          python3 -m pip check
          python3 scripts/check_sympy.py
      - name: Installera låsta grafberoenden för kurvformsuppföljning
        if: inputs.experiment == 'insulin-curve-shape' || steps.resolved.outputs.experiment == 'insulin-curve-shape' || inputs.experiment == 'insulin-external-curve' || steps.resolved.outputs.experiment == 'insulin-external-curve'
        run: python3 -m pip install -r research/plot-requirements.lock
      - name: Installera låsta kanal- och grafberoenden
        if: inputs.experiment == 'shallow-water-hybrid' || steps.resolved.outputs.experiment == 'shallow-water-hybrid'
        run: |
          python3 -m pip install -r research/shallow-water-requirements.lock -r research/plot-requirements.lock
          python3 -m pip check
      - name: Planera, kör och spara forskning
        if: inputs.experiment != 'catalog-only' || inputs.problem_bank_id != ''
        env:
          EXPERIMENT: ${{ inputs.experiment || 'auto' }}
          EXPERIMENT_SEED: ${{ inputs.seed }}
          ORCHESTRATOR_API_KEY: ${{ secrets.ORCHESTRATOR_API_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          PROBLEM_BANK_ID: ${{ inputs.problem_bank_id }}
          PROBLEM_BANK_VERSION: ${{ inputs.problem_bank_version || '1' }}
        run: |
          if [ -n "$PROBLEM_BANK_ID" ]; then
            node research/run-problem-bank-oraklet.mjs
          else
            node research/runner.mjs
          fi
      - name: Samma modell utan labbet (rak fråga)
        if: success() && inputs.problem_bank_id == '' && (inputs.experiment != 'catalog-only')
        # Worst case: three 80 s calls and three 80 s retries plus 3 x 15 s spacing and 3 x 45 s pauses = 11 min.
        timeout-minutes: 13
        env:
          ORCHESTRATOR_API_KEY: ${{ secrets.ORCHESTRATOR_API_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node research/bare-baseline.mjs
      - name: Rita kurvanpassning och prognoser även för sparade delresultat
        if: always() && (inputs.experiment == 'insulin-curve-shape' || steps.resolved.outputs.experiment == 'insulin-curve-shape' || inputs.experiment == 'insulin-external-curve' || steps.resolved.outputs.experiment == 'insulin-external-curve')
        run: python3 scripts/plot_insulin_curves.py reports/oraklet-lab/report.json
      - name: Rita kanalvågor även för sparade delresultat
        if: always() && (inputs.experiment == 'shallow-water-hybrid' || steps.resolved.outputs.experiment == 'shallow-water-hybrid')
        run: python3 scripts/plot_shallow_water.py reports/oraklet-lab/report.json
      - name: Spara planer och rapporter även vid driftfel
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: oraklet-metodtest-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/oraklet-lab/
          if-no-files-found: ignore
