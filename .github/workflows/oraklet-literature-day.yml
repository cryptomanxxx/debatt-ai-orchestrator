name: Oraklets dagliga litteraturforskning
on:
  schedule:
    - cron: '41 9 * * *'
  workflow_dispatch:
permissions:
  contents: read
# Its own group: GitHub keeps only one pending run per group, so sharing the collector's group could
# replace a pending manual pipeline run. Provider pacing and retries cover an occasional overlap.
concurrency:
  group: oraklet-literature-day
  cancel-in-progress: false
jobs:
  literature-day:
    runs-on: ubuntu-latest
    # The pipeline has its own 45-minute bound; tree search, novelty check and registration are small.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The read-only workflow token must not stay in git's config: it would be sent instead of
          # the model-menu app token below, and the push to main would be refused (403).
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Läs, analysera, granska och rapportera
        id: day
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ORCHESTRATOR_API_KEY: ${{ secrets.ORCHESTRATOR_API_KEY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          CORE_API_KEY: ${{ secrets.CORE_API_KEY }}
        run: node research/literature-day.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: oraklet-literature-day-${{ github.run_id }}
          path: |
            reports/
            ai-bus/
          retention-days: 30
          if-no-files-found: warn
      # The model-menu app is a bypass actor on main's ruleset; its token exists only for this push.
      # Only a run of main publishes; the report commit is made on the latest main, never on the checkout.
      - name: Skapa token för ai-bus
        id: app
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && hashFiles('ai-bus/senaste.md') != '' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.MODEL_MENU_APP_CLIENT_ID }}
          private-key: ${{ secrets.MODEL_MENU_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Spara dagens rapport i ai-bus på main
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && hashFiles('ai-bus/senaste.md') != '' }}
        env:
          TOKEN: ${{ steps.app.outputs.token }}
        run: |
          # Only the files this run generated are kept: the day's report, and the day's article
          # with the article index when one was published. Other ai-bus files are never touched.
          day=$(node -p "require('./reports/literature-day/day.json').date")
          article=$(node -p "require('./reports/literature-day/day.json').article?.file ?? ''")
          files="ai-bus/${day}.md ai-bus/senaste.md"
          if [ -n "$article" ]; then
            # One file per date, named by the lab; anything else is refused.
            echo "$article" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}\.md$' || { echo "Ogiltigt artikelnamn"; exit 1; }
            files="$files ai-bus/artiklar/${article} ai-bus/artiklar/README.md"
          fi
          mkdir -p "$RUNNER_TEMP/out/ai-bus/artiklar"
          for f in $files; do cp "$f" "$RUNNER_TEMP/out/$f"; done
          git config user.name 'debatt-ai-model-menu[bot]'
          git config user.email 'debatt-ai-model-menu[bot]@users.noreply.github.com'
          git remote set-url origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # The commit holds only the report, on top of the latest main.
          publish() {
            git fetch --depth=1 origin main
            git reset -q --hard origin/main
            mkdir -p ai-bus/artiklar
            for f in $files; do cp "$RUNNER_TEMP/out/$f" "$f"; done
            git add $files
            git diff --cached --quiet && exit 0
            git commit -q -m "chore(ai-bus): Professor Oraklets dag ${day}"
            git push origin HEAD:main
          }
          # If main moved between fetch and push, try once more.
          publish || publish
          echo "Rapporten finns i ai-bus/${day}.md och ai-bus/senaste.md på main${article:+; dagens artikel i ai-bus/artiklar/${article}}." >> "$GITHUB_STEP_SUMMARY"
      - name: Markera körningen som misslyckad om ett steg fick driftfel
        if: ${{ steps.day.outcome == 'failure' }}
        run: |
          echo "Minst ett steg fick driftfel; se ai-bus-rapporten och artefakten." >> "$GITHUB_STEP_SUMMARY"
          exit 1
