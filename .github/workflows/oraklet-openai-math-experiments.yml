name: Oraklets beräkningsexperiment (openai/math)
on:
  schedule:
    # Mondays 05:23 UTC: one new case per experiment each week, see research/openai-math/EXPERIMENTS.md.
    - cron: '23 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: oraklet-openai-math-experiments
  cancel-in-progress: false
jobs:
  experiments:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The read-only workflow token must not stay in git's config, or the app token below is not used.
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r research/openai-math/requirements.lock
      - name: Kör E1–E3 med kalibreringar
        id: run
        continue-on-error: true
        run: |
          python3 research/openai-math/experiments.py --out reports/openai-math-experiments --ai-bus ai-bus > "$RUNNER_TEMP/report.md"
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: oraklet-openai-math-experiments-${{ github.run_id }}
          path: |
            reports/openai-math-experiments/
            ai-bus/berakningar/
          retention-days: 30
          if-no-files-found: warn
      # The model-menu app is a bypass actor on main's ruleset; its token exists only for this push.
      - name: Skapa token för ai-bus
        id: app
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && hashFiles('reports/openai-math-experiments/result.json') != '' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.MODEL_MENU_APP_CLIENT_ID }}
          private-key: ${{ secrets.MODEL_MENU_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Spara veckans körning i ai-bus på main
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && hashFiles('reports/openai-math-experiments/result.json') != '' }}
        env:
          TOKEN: ${{ steps.app.outputs.token }}
        run: |
          # Only this run's report and the index are committed, on top of the latest main.
          day=$(python3 -c "import json; print(json.load(open('reports/openai-math-experiments/result.json'))['date'])")
          echo "$day" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' || { echo "Ogiltigt datum"; exit 1; }
          mkdir -p "$RUNNER_TEMP/out"
          cp "ai-bus/berakningar/${day}.md" "$RUNNER_TEMP/out/"
          git config user.name 'debatt-ai-model-menu[bot]'
          git config user.email 'debatt-ai-model-menu[bot]@users.noreply.github.com'
          git remote set-url origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          publish() {
            git fetch --depth=1 origin main
            git reset -q --hard origin/main
            mkdir -p ai-bus/berakningar
            cp "$RUNNER_TEMP/out/${day}.md" "ai-bus/berakningar/${day}.md"
            # The index is rebuilt on the latest main, so runs that reached it meanwhile stay listed.
            python3 research/openai-math/experiments.py --index ai-bus
            git add "ai-bus/berakningar/${day}.md" ai-bus/berakningar/README.md
            git diff --cached --quiet && exit 0
            git commit -q -m "chore(ai-bus): Oraklets beräkningsexperiment ${day}"
            git push origin HEAD:main
          }
          publish || publish
          echo "Körningen finns i ai-bus/berakningar/${day}.md på main." >> "$GITHUB_STEP_SUMMARY"
      - name: Markera körningen som misslyckad om en kalibrering misslyckades
        if: ${{ steps.run.outcome == 'failure' }}
        run: |
          echo "En kalibrering misslyckades eller körningen avbröts; se rapporten och artefakten." >> "$GITHUB_STEP_SUMMARY"
          exit 1
