name: Initialize first Oraklet Problem Bank problem
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  initialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Create or verify first Oraklet problem
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node research/problem-bank-init-first-oraklet.mjs
