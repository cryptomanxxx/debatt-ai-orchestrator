name: Initialize Problem Bank smoke fixture

on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: problem-bank-writes
  queue: max
  cancel-in-progress: false

jobs:
  initialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Initialize persistent Problem Bank smoke fixture
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node research/problem-bank-init-smoke-fixture.mjs
