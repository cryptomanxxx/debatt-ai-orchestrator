name: Testa forskningsdatans BootLoops-kontroller
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: research-controls
  cancel-in-progress: false
jobs:
  controls:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Kontrollera sex fasta forskningskontroller utan modell eller databas
        env:
          ORCHESTRATOR_API_KEY: ${{ secrets.ORCHESTRATOR_API_KEY }}
        run: node tests-live/research_controls.mjs
