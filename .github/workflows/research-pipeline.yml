name: Oraklet research pipeline (manual)
run-name: 'Oraklet · ${{ inputs.research_area }} · ${{ inputs.dashboard_request_id || github.run_id }}'
on:
  workflow_dispatch:
    inputs:
      research_area:
        description: 'Research area'
        type: choice
        default: 'PINNs and turbulence'
        options: ['PINNs and turbulence','Experiment design','Kalman state estimation','Causal inference','Model evaluation']
      model_budget:
        description: 'Maximum model calls for the entire chain'
        type: choice
        default: '5'
        options: ['5','10']
      dashboard_request_id:
        description: 'Dashboard request identifier (leave blank for a direct manual run)'
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: literature-benchmark-live
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Test pipeline and selection contracts
        run: node --test tests-research/research-pipeline.test.mjs tests-research/follow-up-quality.test.mjs tests-research/literature-follow-up.test.mjs tests-research/finding-diagnostics.test.mjs
      - name: Collect, analyze and follow up
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ORCHESTRATOR_API_KEY: ${{ secrets.ORCHESTRATOR_API_KEY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          CORE_API_KEY: ${{ secrets.CORE_API_KEY }}
          RESEARCH_AREA: ${{ inputs.research_area }}
          PIPELINE_MODEL_BUDGET: ${{ inputs.model_budget }}
          PIPELINE_REQUEST_ID: ${{ inputs.dashboard_request_id }}
          RESEARCH_DASHBOARD_ENABLED: ${{ vars.RESEARCH_DASHBOARD_ENABLED }}
        run: node research/research-pipeline.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: research-pipeline-report
          path: reports/research-pipeline/
          retention-days: 30
          if-no-files-found: warn
