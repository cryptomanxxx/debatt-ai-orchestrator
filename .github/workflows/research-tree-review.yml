name: Research Tree Search (review only)
on:
  workflow_dispatch:
    inputs:
      evidence_report_id:
        description: 'Existing immutable literature evidence report UUID'
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: oraklet-research-tree-review
  cancel-in-progress: false
jobs:
  research-tree:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Test bounded tree, source provenance and Research Loop integration
        run: node --test tests-research/agentic-tree-search.test.mjs tests-research/research-tree-planner.test.mjs tests-research/evidence-replay-verifier.test.mjs
      - name: Load saved literature evidence and assemble review queue
        env:
          RESEARCH_TREE_REPORT_ID: ${{ inputs.evidence_report_id }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node research/research-tree-planner.mjs
      - name: Save review-only tree and portfolio report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: research-tree-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/research-tree-review/
          retention-days: 30
          if-no-files-found: warn
