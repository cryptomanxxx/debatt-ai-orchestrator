name: Scientific Model Router (GitHub-native)
on:
  workflow_dispatch:
    inputs:
      task:
        description: Scientific task category
        required: true
        type: choice
        options: [reasoning, literature, coding, fast]
        default: reasoning
      provider:
        description: Preferred provider (auto follows explicit priority)
        required: true
        type: choice
        options: [auto, blablador, hip]
        default: auto
permissions:
  contents: read
concurrency:
  group: scientific-model-router
  cancel-in-progress: false
jobs:
  route:
    environment: research-inference
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Validate Cloudflare research client offline
        run: node --test tests-research/worker-research-client.test.mjs
      - name: Select available scientific model and run bounded pilot
        env:
          ORCHESTRATOR_API_KEY: ${{ secrets.ORCHESTRATOR_API_KEY }}
          ROUTER_TASK: ${{ inputs.task }}
          ROUTER_PROVIDER: ${{ inputs.provider }}
        run: node research/scientific-worker-router.mjs
      - name: Save router decision and results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scientific-model-router-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/scientific-model-router/report.json
          retention-days: 30
          if-no-files-found: warn
