name: Compare HIP and Blablador on verified SymPy cases
on:
  workflow_dispatch:
    inputs:
      seed:
        description: Same deterministic 1-9 digit seed for both providers
        type: string
        required: true
        default: '20261020'
permissions:
  contents: read
concurrency:
  group: sympy-provider-comparison
  cancel-in-progress: false
jobs:
  compare:
    if: github.ref == 'refs/heads/main'
    environment: research-inference
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        provider: [hip, blablador]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pinned SymPy verifier
        run: python3 -m pip install -r research/sympy-requirements.lock
      - name: Validate existing scientific pilot without provider secrets
        run: node --test tests-research/github-router-sympy-pilot.test.mjs
      - name: Run provider-specific verified research
        env:
          ORCHESTRATOR_API_KEY: ${{ secrets.ORCHESTRATOR_API_KEY }}
          ROUTER_PROVIDER: ${{ matrix.provider }}
          EXPERIMENT_SEED: ${{ inputs.seed }}
        run: node research/github-router-sympy-pilot.mjs
      - name: Preserve separate provider reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sympy-provider-${{ matrix.provider }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/github-router-sympy/
          if-no-files-found: warn
          retention-days: 30
