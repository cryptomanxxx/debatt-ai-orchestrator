# TEMPORARY: reproduce the intermittent Python Worker 500 with diagnostics. Removed before merge.
name: tmp-bootloops-flake
on:
  push:
    branches: [ccr-c66c91c6-8ymi87]
permissions:
  contents: read
jobs:
  repeat:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.19'
      - run: npm ci
      - run: npm run check:workers
      - run: npm run check:bootloops:worker
      - name: Probe pywrangler dev for transient 500s and reloads
        working-directory: bootloops-worker
        run: |
          uvx --from workers-py==1.17.6 pywrangler dev --ip 127.0.0.1 --port 8788 --local --show-interactive-dev-session=false > dev.log 2>&1 &
          pid=$!
          start=$(date +%s.%N)
          for i in $(seq 1 600); do
            code=$(curl -s -o body.txt -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:8788/other || echo 000)
            t=$(echo "$(date +%s.%N) - $start" | bc)
            echo "$t $code" >> probe.txt
            if [ "$code" = "500" ]; then echo "--- 500 at $t s: $(head -c 400 body.txt)"; fi
            sleep 0.1
          done
          kill $pid || true
          echo "::group::dev.log without plain 404 lines"; grep -v '404 Not Found' dev.log; echo "::endgroup::"
          echo "first 404 and every non-404 after it:"
          awk 'BEGIN{seen=0} {if($2=="404"&&!seen){print "first 404 at",$1; seen=1} else if(seen&&$2!="404"){print "after-ready", $0}}' probe.txt
          echo "status counts:"; awk '{print $2}' probe.txt | sort | uniq -c
