# TEMPORARY: reproduce the intermittent Python Worker 500 with diagnostics. Removed before merge.
name: tmp-bootloops-flake
on:
  push:
    branches: [ccr-c66c91c6-8ymi87]
permissions:
  contents: read
jobs:
  repeat:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
        variant: [baseline, drained]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.19'
      - run: npm ci
      - run: npm run check:workers
      - name: Use the main-branch Worker for the baseline variant
        if: matrix.variant == 'baseline'
        run: git fetch -q --depth=1 origin main && git show origin/main:bootloops-worker/src/entry.py > bootloops-worker/src/entry.py
      - run: npm run check:bootloops:worker
      - name: Probe unread-body responses on a reused connection
        run: |
          cd bootloops-worker
          uvx --from workers-py==1.17.6 pywrangler dev --ip 127.0.0.1 --port 8788 --local --show-interactive-dev-session=false > dev.log 2>&1 &
          cd ..
          node scripts/tmp-probe-keepalive.mjs
          echo "::group::dev.log errors"; grep -iE "error|exception|500|traceback" bootloops-worker/dev.log | head -80; echo "::endgroup::"
