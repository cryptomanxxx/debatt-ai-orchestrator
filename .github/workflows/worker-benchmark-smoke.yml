name: Verify Cloudflare research benchmark gateway
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: worker-benchmark-smoke
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: research-inference
    strategy:
      fail-fast: false
      matrix:
        provider: [hip, blablador]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Check deployment, identity and bounded inference
        env:
          ORCHESTRATOR_API_KEY: ${{ secrets.ORCHESTRATOR_API_KEY }}
          RESEARCH_PROVIDER: ${{ matrix.provider }}
        run: node research/worker-benchmark-smoke.mjs
      - name: Archive sanitized connectivity report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: worker-benchmark-${{ matrix.provider }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/worker-benchmark-smoke/
          if-no-files-found: ignore
          retention-days: 14
