name: Verify Cloudflare research benchmark gateway
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: worker-benchmark-smoke
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: research-inference
    strategy:
      fail-fast: false
      matrix:
        provider: [hip, blablador]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Check deployment, identity and bounded inference
        env:
          ORCHESTRATOR_API_KEY: ${{ secrets.ORCHESTRATOR_API_KEY }}
          RESEARCH_PROVIDER: ${{ matrix.provider }}
        run: node research/worker-benchmark-smoke.mjs
      - name: Archive sanitized connectivity report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: worker-benchmark-${{ matrix.provider }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/worker-benchmark-smoke/
          if-no-files-found: ignore
          retention-days: 14
